name: Compilation et tests

# Seule l'édition Avalonia (avalonia/) est maintenue et construite. Les éditions WPF (racine) et
# GTK (linux/) sont gelées : leur code reste dans le dépôt, linux/Core est commun avec Avalonia.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-server:
    name: Serveur de support
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests (serveur et contrat avec le navigateur)
        run: dotnet test support-server/tests/PommeBrowser.SupportServer.Tests --configuration Release

      - name: Image Docker
        run: docker build --tag pommebrowser-support:ci support-server

  avalonia-linux:
    name: Avalonia Linux (AppImage)
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: >
          dotnet test tests/PommeBrowser.Tests/PommeBrowser.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=resultats.trx"
          --results-directory TestResults

      # Le vrai navigateur ouvert sans écran (Avalonia.Headless), piloté au clavier et à la souris.
      - name: Tests de l'interface
        timeout-minutes: 15
        env:
          AVALONIA_TELEMETRY_OPTOUT: 1
        run: >
          dotnet test tests/PommeBrowser.UiTests/PommeBrowser.UiTests.csproj
          --configuration Release
          --logger "trx;LogFileName=resultats-interface.trx"
          --results-directory TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
          if-no-files-found: ignore

      - name: Compilation de l'édition Avalonia
        run: dotnet build avalonia/PommeBrowser.csproj --configuration Release

      # Le moteur Flash d'origine (Pomme Legacy) est pris dans sa version GitHub, s'il est publié.
      - name: AppImage (x86_64 et aarch64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: avalonia/packaging/linux/build-appimage.sh all

      - name: Essai de lancement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 gstreamer1.0-plugins-good xvfb xauth dbus
          linux/packaging/smoke-test.sh avalonia/packaging/out/PommeBrowser-*-x86_64.AppImage

      - name: Paquets AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Avalonia-Linux-AppImage
          path: |
            avalonia/packaging/out/*.AppImage
            avalonia/packaging/out/*.sha256
          if-no-files-found: error

  avalonia-windows:
    name: Avalonia Windows
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Même nom d'exécutable que l'édition WPF (voir build-pack-velopack.ps1 -Edition avalonia).
      - name: Publication (win-x64)
        shell: pwsh
        run: |
          dotnet publish avalonia/PommeBrowser.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=none -p:RuffleDownloadOptional=false --output artifacts/avalonia-win-x64
          Move-Item artifacts/avalonia-win-x64/pommebrowser.exe artifacts/avalonia-win-x64/MyHomelabBrowser.exe
          if (-not (Test-Path artifacts/avalonia-win-x64/Assets/Ruffle/ruffle.js)) { throw "Ruffle absent de la publication." }

      - name: Moteur Flash d'origine (Pomme Legacy, s'il est publié)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./legacy-engine/fetch-engine.ps1 -Destination artifacts/avalonia-win-x64/legacy

      # Moteur Flash intégré (flash-engine/) : hôte NPAPI compilé en code natif (NativeAOT).
      - name: Moteur Flash intégré (PommeFlashHost)
        shell: pwsh
        run: |
          dotnet publish flash-engine/PommeFlash.Host/PommeFlash.Host.csproj --configuration Release --runtime win-x64 -p:PublishAot=true -p:DebugType=none --output artifacts/avalonia-win-x64/flash
          if (-not (Test-Path artifacts/avalonia-win-x64/flash/PommeFlashHost.exe)) { throw "PommeFlashHost absent de la publication." }

      # Le vrai hôte, avec un greffon NPAPI de test qui rapporte ce qu'il observe.
      - name: Tests du moteur Flash intégré
        shell: pwsh
        run: |
          $plugin = Join-Path $env:RUNNER_TEMP "npPommeTest.dll"
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            clang -shared -O2 -o $plugin flash-engine/test-plugin/testplugin.c -luser32
          } else {
            gcc -shared -O2 -o $plugin flash-engine/test-plugin/testplugin.c
          }
          if ($LASTEXITCODE -ne 0) { throw "Greffon de test non compilé." }
          $env:POMMEFLASH_HOST = (Resolve-Path artifacts/avalonia-win-x64/flash/PommeFlashHost.exe).Path
          $env:POMMEFLASH_TEST_PLUGIN = $plugin
          dotnet test tests/PommeFlash.Tests/PommeFlash.Tests.csproj --configuration Release --logger "trx;LogFileName=moteur-flash.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw "Tests du moteur Flash intégré en échec." }

      - name: Résultats des tests du moteur Flash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests-moteur-flash
          path: TestResults
          if-no-files-found: ignore

      - name: Dossier publié
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Avalonia-Windows-x64
          path: artifacts/avalonia-win-x64
          if-no-files-found: error

  avalonia-macos:
    name: Avalonia macOS (.app)
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: PommeBrowser.app (arm64 et x64)
        run: avalonia/packaging/macos/build-app.sh all

      - name: Archives de l'app
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Avalonia-macOS
          path: |
            avalonia/packaging/out/*.zip
            avalonia/packaging/out/*.sha256
          if-no-files-found: error
