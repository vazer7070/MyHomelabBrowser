name: Compilation et tests

# Seule l'édition Avalonia (avalonia/) est maintenue et construite. Les éditions WPF (racine) et
# GTK (linux/) sont gelées : leur code reste dans le dépôt, linux/Core est commun avec Avalonia.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-server:
    name: Serveur de support
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests (serveur et contrat avec le navigateur)
        run: dotnet test support-server/tests/PommeBrowser.SupportServer.Tests --configuration Release

      - name: Image Docker
        run: docker build --tag pommebrowser-support:ci support-server

  avalonia-linux:
    name: Avalonia Linux (AppImage)
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: >
          dotnet test tests/PommeBrowser.Tests/PommeBrowser.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=resultats.trx"
          --results-directory TestResults

      # Le vrai navigateur ouvert sans écran (Avalonia.Headless), piloté au clavier et à la souris.
      - name: Tests de l'interface
        timeout-minutes: 15
        env:
          AVALONIA_TELEMETRY_OPTOUT: 1
        run: >
          dotnet test tests/PommeBrowser.UiTests/PommeBrowser.UiTests.csproj
          --configuration Release
          --logger "trx;LogFileName=resultats-interface.trx"
          --results-directory TestResults

      # Moteur Flash intégré (flash-engine/) : hôte NPAPI de Linux (GTK 2, XEmbed), compilé en code
      # natif (NativeAOT), puis testé sans écran avec le greffon NPAPI de test (GTK 2, comme Flash).
      - name: Moteur Flash intégré (PommeFlashHost, linux-x64)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk2.0-dev libxtst-dev xvfb xauth
          dotnet publish flash-engine/PommeFlash.Host/PommeFlash.Host.csproj --configuration Release --runtime linux-x64 -p:PublishAot=true -p:DebugType=none --output artifacts/flash-linux-x64
          test -x artifacts/flash-linux-x64/PommeFlashHost

      - name: Tests du moteur Flash intégré
        env:
          POMMEFLASH_HOST: ${{ github.workspace }}/artifacts/flash-linux-x64/PommeFlashHost
          POMMEFLASH_TEST_PLUGIN: ${{ runner.temp }}/libnpPommeTest.so
        run: |
          gcc -shared -fPIC -O2 -o "$POMMEFLASH_TEST_PLUGIN" flash-engine/test-plugin/testplugin.c $(pkg-config --cflags --libs gtk+-2.0) -lX11 -lXtst -lpthread
          xvfb-run --auto-servernum dotnet test tests/PommeFlash.Tests/PommeFlash.Tests.csproj --configuration Release --logger "trx;LogFileName=moteur-flash-linux.trx" --results-directory TestResults
          # Côté PommeBrowser, avec l'hôte réel : lecteur figé signalé puis rétabli, plantage reconnu.
          xvfb-run --auto-servernum dotnet test tests/PommeBrowser.UiTests/PommeBrowser.UiTests.csproj --configuration Release --filter "FullyQualifiedName~FlashHostTests" --logger "trx;LogFileName=moteur-flash-navigateur.trx" --results-directory TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
          if-no-files-found: ignore

      - name: Moteur Flash intégré (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: PommeFlashHost-Linux-x64
          path: artifacts/flash-linux-x64
          if-no-files-found: error

      - name: Compilation de l'édition Avalonia
        run: dotnet build avalonia/PommeBrowser.csproj --configuration Release

      # Le moteur Flash d'origine (Pomme Legacy) est pris dans sa version GitHub, s'il est publié.
      - name: AppImage (x86_64 et aarch64)
        env:
          GH_TOKEN: ${{ github.token }}
          POMMEFLASH_HOST_DIR: ${{ github.workspace }}/artifacts/flash-linux-x64
        run: avalonia/packaging/linux/build-appimage.sh all

      - name: Essai de lancement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 gstreamer1.0-plugins-good xvfb xauth dbus
          linux/packaging/smoke-test.sh avalonia/packaging/out/PommeBrowser-*-x86_64.AppImage

      - name: Paquets AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Avalonia-Linux-AppImage
          path: |
            avalonia/packaging/out/*.AppImage
            avalonia/packaging/out/*.sha256
          if-no-files-found: error

  avalonia-windows:
    name: Avalonia Windows
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Même nom d'exécutable que l'édition WPF (voir build-pack-velopack.ps1 -Edition avalonia).
      - name: Publication (win-x64)
        shell: pwsh
        run: |
          dotnet publish avalonia/PommeBrowser.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=none -p:RuffleDownloadOptional=false --output artifacts/avalonia-win-x64
          Move-Item artifacts/avalonia-win-x64/pommebrowser.exe artifacts/avalonia-win-x64/MyHomelabBrowser.exe
          if (-not (Test-Path artifacts/avalonia-win-x64/Assets/Ruffle/ruffle.js)) { throw "Ruffle absent de la publication." }

      - name: Moteur Flash d'origine (Pomme Legacy, s'il est publié)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./legacy-engine/fetch-engine.ps1 -Destination artifacts/avalonia-win-x64/legacy

      # Moteur Flash intégré (flash-engine/) : hôte NPAPI compilé en code natif (NativeAOT), en
      # 64 bits (module NPSWF64) et en 32 bits (module NPSWF32, dans flash\x86).
      - name: Moteur Flash intégré (PommeFlashHost)
        shell: pwsh
        run: |
          dotnet publish flash-engine/PommeFlash.Host/PommeFlash.Host.csproj --configuration Release --runtime win-x64 -p:PublishAot=true -p:DebugType=none --output artifacts/avalonia-win-x64/flash
          if (-not (Test-Path artifacts/avalonia-win-x64/flash/PommeFlashHost.exe)) { throw "PommeFlashHost absent de la publication." }
          dotnet publish flash-engine/PommeFlash.Host/PommeFlash.Host.csproj --configuration Release --runtime win-x86 -p:PublishAot=true -p:DebugType=none --output artifacts/avalonia-win-x64/flash/x86
          if (-not (Test-Path artifacts/avalonia-win-x64/flash/x86/PommeFlashHost.exe)) { throw "PommeFlashHost 32 bits absent de la publication." }

      # Propre à Windows : instance unique (mutex nommé et tube réservé à l'utilisateur) et
      # inscription comme navigateur (registre de l'utilisateur, sous un nom de test).
      - name: Tests de l'instance unique et du navigateur par défaut (Windows)
        run: >
          dotnet test tests/PommeBrowser.Tests/PommeBrowser.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~SingleInstanceTests|FullyQualifiedName~DefaultBrowserTests"
          --logger "trx;LogFileName=instance-unique.trx"
          --results-directory TestResults

      # Le vrai hôte, avec un greffon NPAPI de test qui rapporte ce qu'il observe, dans les deux
      # architectures (greffon 32 bits : clang pour i686, points d'entrée __stdcall comme Flash).
      - name: Tests du moteur Flash intégré
        shell: pwsh
        run: |
          $plugin = Join-Path $env:RUNNER_TEMP "npPommeTest.dll"
          $plugin32 = Join-Path $env:RUNNER_TEMP "x86/npPommeTest.dll"
          New-Item -ItemType Directory -Force (Split-Path $plugin32) | Out-Null
          clang -shared -O2 -o $plugin flash-engine/test-plugin/testplugin.c -luser32
          if ($LASTEXITCODE -ne 0) { throw "Greffon de test non compilé." }
          clang --target=i686-pc-windows-msvc -shared -O2 -o $plugin32 flash-engine/test-plugin/testplugin.c -luser32
          if ($LASTEXITCODE -ne 0) { throw "Greffon de test 32 bits non compilé." }
          $runs = @(
            @{ Host = "artifacts/avalonia-win-x64/flash/PommeFlashHost.exe"; Plugin = $plugin; Name = "moteur-flash" },
            @{ Host = "artifacts/avalonia-win-x64/flash/x86/PommeFlashHost.exe"; Plugin = $plugin32; Name = "moteur-flash-32" })
          foreach ($run in $runs) {
            $env:POMMEFLASH_HOST = (Resolve-Path $run.Host).Path
            $env:POMMEFLASH_TEST_PLUGIN = $run.Plugin
            dotnet test tests/PommeFlash.Tests/PommeFlash.Tests.csproj --configuration Release --logger "trx;LogFileName=$($run.Name).trx" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { throw "Tests du moteur Flash intégré en échec ($($run.Name))." }
          }

      # Espion NPAPI (flash-engine/spy), outil de diagnostic livré à part, en 64 et 32 bits :
      # vérifié transparent devant le greffon de test, script d'installation essayé sur des DLL système.
      - name: Espion du moteur Flash
        shell: pwsh
        run: |
          $out = "artifacts/espion-flash"
          New-Item -ItemType Directory -Force $out | Out-Null
          clang -shared -O2 -o "$out/npPommeEspion.dll" flash-engine/spy/npspy.c
          if ($LASTEXITCODE -ne 0) { throw "Espion non compilé." }
          clang --target=i686-pc-windows-msvc -shared -O2 -o "$out/npPommeEspion32.dll" flash-engine/spy/npspy.c
          if ($LASTEXITCODE -ne 0) { throw "Espion 32 bits non compilé." }
          Copy-Item flash-engine/spy/Espion-Flash.ps1, flash-engine/spy/README.md $out

          # Transparence : les tests de l'hôte passent à l'identique avec l'espion devant le greffon.
          $runs = @(
            @{ Host = "artifacts/avalonia-win-x64/flash/PommeFlashHost.exe"; Plugin = (Join-Path $env:RUNNER_TEMP "npPommeTest.dll"); Spy = "$out/npPommeEspion.dll"; Dir = "espion-test" },
            @{ Host = "artifacts/avalonia-win-x64/flash/x86/PommeFlashHost.exe"; Plugin = (Join-Path $env:RUNNER_TEMP "x86/npPommeTest.dll"); Spy = "$out/npPommeEspion32.dll"; Dir = "espion-test-32" })
          foreach ($run in $runs) {
            $dir = Join-Path $env:RUNNER_TEMP $run.Dir
            New-Item -ItemType Directory -Force (Join-Path $dir "espion") | Out-Null
            Copy-Item $run.Plugin (Join-Path $dir "espion/npPommeTest.dll")
            Copy-Item $run.Spy (Join-Path $dir "npPommeTest.dll")
            $env:POMMEFLASH_HOST = (Resolve-Path $run.Host).Path
            $env:POMMEFLASH_TEST_PLUGIN = Join-Path $dir "npPommeTest.dll"
            dotnet test tests/PommeFlash.Tests/PommeFlash.Tests.csproj --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "L'espion change le comportement du module ($($run.Dir))." }
            if (-not (Get-ChildItem (Join-Path $dir "espion/journaux") -Filter *.log)) { throw "Aucun journal de l'espion ($($run.Dir))." }
          }

          # Script d'installation, sur des copies de DLL système (qui ont une description de version) :
          # l'espion de l'architecture du module prend sa place, puis tout est remis en place.
          $cases = @(
            @{ Name = "NPSWF64_1_0_0_0.dll"; Source = "$env:WINDIR\System32\version.dll"; Dir = "espion-plugins"; Machine = "Amd64" },
            @{ Name = "NPSWF32_1_0_0_0.dll"; Source = "$env:WINDIR\SysWOW64\version.dll"; Dir = "espion-plugins-32"; Machine = "I386" })
          foreach ($case in $cases) {
            $plugins = Join-Path $env:RUNNER_TEMP $case.Dir
            New-Item -ItemType Directory -Force $plugins | Out-Null
            $module = Join-Path $plugins $case.Name
            Copy-Item $case.Source $module
            $original = (Get-FileHash $module).Hash
            $description = (Get-Item $module).VersionInfo.FileDescription
            & "$out/Espion-Flash.ps1" -Dossier $plugins
            if ((Get-FileHash $module).Hash -eq $original) { throw "Espion non installé ($($case.Name))." }
            if ((Get-Item $module).VersionInfo.FileDescription -ne $description) { throw "Description de version non copiée ($($case.Name))." }
            $reader = [System.Reflection.PortableExecutable.PEReader]::new([System.IO.File]::OpenRead($module))
            $machine = $reader.PEHeaders.CoffHeader.Machine.ToString()
            $reader.Dispose()
            if ($machine -ne $case.Machine) { throw "Espion de la mauvaise architecture ($machine) pour $($case.Name)." }
            & "$out/Espion-Flash.ps1" -Dossier $plugins -Retirer
            if ((Get-FileHash $module).Hash -ne $original) { throw "Module non remis en place ($($case.Name))." }
          }

      - name: Espion du moteur Flash (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: espion-flash
          path: artifacts/espion-flash
          if-no-files-found: error

      - name: Résultats des tests du moteur Flash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests-moteur-flash
          path: TestResults
          if-no-files-found: ignore

      - name: Dossier publié
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Avalonia-Windows-x64
          path: artifacts/avalonia-win-x64
          if-no-files-found: error

  avalonia-macos:
    name: Avalonia macOS (.app)
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: PommeBrowser.app (arm64 et x64)
        run: avalonia/packaging/macos/build-app.sh all

      - name: Archives de l'app
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Avalonia-macOS
          path: |
            avalonia/packaging/out/*.zip
            avalonia/packaging/out/*.sha256
          if-no-files-found: error
