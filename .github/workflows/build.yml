name: Compilation et tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restauration des paquets
        run: dotnet restore MyHomelabBrowser.sln

      - name: Compilation de l'application
        run: dotnet build MyHomelabBrowser.csproj --configuration Release --no-restore

      - name: Tests
        run: >
          dotnet test tests/PommeBrowser.Tests/PommeBrowser.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=resultats.trx"
          --results-directory TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
          if-no-files-found: ignore

  support-server:
    name: Serveur de support
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests (serveur et contrat avec le navigateur)
        run: dotnet test support-server/tests/PommeBrowser.SupportServer.Tests --configuration Release

      - name: Image Docker
        run: docker build --tag pommebrowser-support:ci support-server

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests (logique commune et édition Linux)
        run: dotnet test tests/PommeBrowser.Tests/PommeBrowser.Tests.csproj --configuration Release

      - name: Compilation de l'édition Linux
        run: dotnet build linux/PommeBrowser.Linux.csproj --configuration Release

      - name: AppImage (x86_64 et aarch64)
        run: linux/packaging/build-appimage.sh all

      - name: Essai de lancement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkitgtk-6.0-4 libadwaita-1-0 gstreamer1.0-plugins-good xvfb xauth dbus
          linux/packaging/smoke-test.sh linux/packaging/out/PommeBrowser-*-x86_64.AppImage

      - name: Paquets AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PommeBrowser-Linux-AppImage
          path: |
            linux/packaging/out/*.AppImage
            linux/packaging/out/*.sha256
          if-no-files-found: error
